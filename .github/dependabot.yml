version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      next:
        patterns:
          - next
          - eslint-config-next
          - react
          - react-dom
      tooling:
        patterns:
          - eslint*
          - prettier
          - vitest
          - vite
          - typescript
          - "@types/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
